name: Validate source and Docker images
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tools.txt
      - run: python -m compileall -q app web scripts tests
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [mcp, web]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker build --target ${{ matrix.target }} --tag resilient-mcp-${{ matrix.target }}:ci .
